services:
  agent-app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MIA_API_KEY: ${MIA_API_KEY:-}
      MIA_BASE_URL: ${MIA_BASE_URL:-https://mia.csp.kloudeks.com/v1}
      MIA_CHAT_MODEL: ${MIA_CHAT_MODEL:-deepseek-ai/DeepSeek-V4.1-Flash}
      MIA_EMBEDDING_MODEL: ${MIA_EMBEDDING_MODEL:-kkbhackathon2026/Qwen3-Embedding-8B}
      MIA_OCR_MODEL: ${MIA_OCR_MODEL:-kkbhackathon2026/Unlimited-OCR}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      TRUSTED_INTERNAL_URLS: ${TRUSTED_INTERNAL_URLS:-http://searxng:8080}
      VOICE_EMA_MODEL: /app/.voice-models/ema-tts
      HF_HOME: /app/.voice-models
    ports:
      - "127.0.0.1:${AGENT_PORT:-8870}:8870"
    depends_on:
      searxng:
        condition: service_healthy
      voice-provision:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ${LAKEHOUSE_DIR:-./data_pipeline/lakehouse}
        target: /app/data_pipeline/lakehouse
        read_only: true
        bind:
          create_host_path: false
      - agent-runtime:/app/.lakehouse-runtime
      - type: volume
        source: voice-models
        target: /app/.voice-models
        read_only: true
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  voice-provision:
    build:
      context: .
      dockerfile: Dockerfile
    user: "0:0"
    environment:
      VOICE_EMA_MODEL: /app/.voice-models/ema-tts
      HF_HOME: /app/.voice-models
    volumes:
      - voice-models:/app/.voice-models
    entrypoint: ["python", "-m", "agentic_analytics.voice.provision"]

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
      - SEARXNG_LIMITER=false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  agent-runtime:
  voice-models:
