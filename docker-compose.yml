services:
  agent-app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MIA_API_KEY: ${MIA_API_KEY:-}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
    ports:
      - "127.0.0.1:${AGENT_PORT:-8870}:8870"
    volumes:
      - type: bind
        source: ${LAKEHOUSE_DIR:-./data_pipeline/lakehouse}
        target: /app/data_pipeline/lakehouse
        read_only: true
        bind:
          create_host_path: false
      - agent-runtime:/app/.lakehouse-runtime
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  searxng:
    image: searxng/searxng@sha256:b763048b34ccd93560e6db5af508312d1ba64d072ab2d11cffec64f71be24179
    ports:
      - "127.0.0.1:${SEARCH_PORT:-8888}:8080"
    environment:
      SEARXNG_SETTINGS_PATH: /opt/agentic-search/settings.yml
    entrypoint: ["/bin/sh", "/opt/agentic-search/start.sh"]
    volumes:
      - ./searxng:/opt/agentic-search:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  agent-runtime:
