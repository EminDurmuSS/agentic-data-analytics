<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700" role="img" aria-labelledby="title desc">
  <title id="title">KKB agent araç katmanı</title><desc id="desc">Katalog, DuckDB, istatistiksel analiz, web ve URL araçlarının güvenlik, kanıt ve sonuç katmanlarıyla ilişkisi.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#4d6278"/></marker><style>text{font-family:Arial,sans-serif;fill:#192a3a}.t{font-size:27px;font-weight:700}.h{font-size:18px;font-weight:700}.l{font-size:15px;font-weight:600}.s{font-size:13px}.b{stroke:#4d6278;stroke-width:2}.blue{fill:#ebf4ff}.green{fill:#e9f8ef}.yellow{fill:#fff7df}.pink{fill:#fff0f0}.line{stroke:#4d6278;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1180" height="700" fill="white"/><text x="42" y="46" class="t">Hücre 2 · Araç katmanı</text><text x="42" y="70" class="s">Tüm araç sonuçları sınırlı JSON olarak agent’a geri döner; veri kanıtı ve istatistiksel kanıt kaydedilir.</text>
  <rect x="55" y="110" width="250" height="112" rx="14" class="b blue"/><text x="180" y="140" text-anchor="middle" class="h">Metrik ve veri erişimi</text><text x="180" y="169" text-anchor="middle" class="l">catalog_search</text><text x="180" y="191" text-anchor="middle" class="l">duckdb_query</text><text x="180" y="211" text-anchor="middle" class="s">salt-okunur · en çok 200 satır</text>
  <rect x="465" y="100" width="275" height="134" rx="14" class="b green"/><text x="602" y="130" text-anchor="middle" class="h">Zaman serisi analizi</text><text x="602" y="160" text-anchor="middle" class="l">detect_anomalies</text><text x="602" y="183" text-anchor="middle" class="l">compare_indicators</text><text x="602" y="206" text-anchor="middle" class="l">detect_change_points</text><text x="602" y="225" text-anchor="middle" class="s">3σ/IQR · Pearson/Granger · PELT</text>
  <rect x="875" y="110" width="250" height="112" rx="14" class="b yellow"/><text x="1000" y="140" text-anchor="middle" class="h">Güncel dış kaynak</text><text x="1000" y="169" text-anchor="middle" class="l">web_search</text><text x="1000" y="191" text-anchor="middle" class="l">analyze_url</text><text x="1000" y="211" text-anchor="middle" class="s">web · PDF · Excel · görsel · metin</text>
  <path d="M305 166H465 M740 166H875" class="line"/>
  <rect x="85" y="320" width="270" height="148" rx="14" class="b pink"/><text x="220" y="350" text-anchor="middle" class="h">Güvenlik katmanı</text><text x="220" y="380" text-anchor="middle" class="l">readonly_sql</text><text x="220" y="404" text-anchor="middle" class="s">Yalnız SELECT / WITH / EXPLAIN</text><text x="220" y="427" text-anchor="middle" class="l">public_url</text><text x="220" y="451" text-anchor="middle" class="s">özel ağ / loopback engeli</text>
  <rect x="455" y="320" width="290" height="148" rx="14" class="b blue"/><text x="600" y="350" text-anchor="middle" class="h">Standartlaştırma</text><text x="600" y="380" text-anchor="middle" class="l">numeric_series · compact</text><text x="600" y="405" text-anchor="middle" class="s">tarih ve sayısal değer temizliği</text><text x="600" y="430" text-anchor="middle" class="s">araç yanıtı en çok 12.000 karakter</text>
  <rect x="835" y="320" width="270" height="148" rx="14" class="b green"/><text x="970" y="350" text-anchor="middle" class="h">Kanıt kaydı</text><text x="970" y="380" text-anchor="middle" class="l">PROVENANCE</text><text x="970" y="404" text-anchor="middle" class="s">tablo · SQL · satır sayısı</text><text x="970" y="429" text-anchor="middle" class="l">STATS / TOOL_TRACE</text><text x="970" y="451" text-anchor="middle" class="s">test sonucu · araç izi</text>
  <path d="M180 222V320 M602 234V320 M1000 222V320" class="line"/>
  <rect x="390" y="555" width="400" height="74" rx="14" class="b yellow"/><text x="590" y="585" text-anchor="middle" class="h">Agent’a dönen gözlem (JSON)</text><text x="590" y="609" text-anchor="middle" class="s">sonuç + kaynak bilgisi + istatistiksel kanıt</text>
  <path d="M220 468V525H590V555 M600 468V555 M970 468V525H590" class="line"/>
</svg>
