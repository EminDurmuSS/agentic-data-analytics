use_default_settings:
  engines:
    keep_only:
      - google
      - bing
      - duckduckgo
      - brave

server:
  limiter: false
  public_instance: false
  image_proxy: false

outgoing:
  request_timeout: 8.0
  max_request_timeout: 12.0

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
